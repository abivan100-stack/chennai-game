<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Anna</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛺</text></svg>" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; }
      .ui {
        position: fixed; pointer-events: none; color: #fff;
        font: 600 18px/1.3 system-ui, sans-serif; text-shadow: 0 1px 3px #000c;
      }
      #mission { top: 16px; left: 16px; }
      #wallet { top: 16px; right: 16px; font-size: 24px; }
      #prompt {
        bottom: 18%; left: 50%; transform: translateX(-50%);
        padding: 6px 14px; border-radius: 6px; background: #000a; display: none;
      }
      #speed { bottom: 16px; right: 16px; font-size: 28px; display: none; }
      #dialogue {
        bottom: 7%; left: 50%; transform: translateX(-50%); width: min(560px, 90vw); box-sizing: border-box;
        padding: 10px 16px; border-radius: 6px; border-left: 4px solid #f2c200; background: #000c;
        font-weight: 400; display: none;
      }
      #dialogue b { color: #f2c200; }
      #hint { top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 22px; }
      #minimap {
        position: fixed; bottom: 16px; left: 16px; width: 180px; height: 180px; pointer-events: none;
        border: 2px solid #ffffffcc; border-radius: 8px; box-shadow: 0 2px 8px #0008;
      }
      #debug {
        top: 52px; left: 16px; padding: 8px 10px; border-radius: 6px; background: #000b;
        font: 12px/1.4 ui-monospace, monospace; display: none; pointer-events: auto;
      }
      #debug pre { margin: 0 0 6px; }
      #loading {
        position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: #14161c; color: #f2c200; font: 600 18px system-ui, sans-serif;
      }
      #loading h1 { margin: 0; font-size: 40px; letter-spacing: 1px; }
      #loading .bar { width: min(320px, 70vw); height: 8px; border-radius: 4px; background: #ffffff22; overflow: hidden; }
      #loading-fill { width: 0; height: 100%; background: #f2c200; transition: width 0.2s; }
      #loading-text { color: #ccc; font-weight: 400; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="loading">
      <h1>Auto Anna</h1>
      <div class="bar"><div id="loading-fill"></div></div>
      <div id="loading-text">Loading Mylapore…</div>
    </div>
    <div id="mission" class="ui"></div>
    <div id="wallet" class="ui"></div>
    <div id="prompt" class="ui"></div>
    <div id="dialogue" class="ui"></div>
    <div id="speed" class="ui"></div>
    <canvas id="minimap"></canvas>
    <div id="hint" class="ui">Click to play</div>
    <div id="debug" class="ui">
      <pre id="debug-text"></pre>
      <label>Quality
        <select id="quality-mode">
          <option value="auto">Auto</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </label>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
