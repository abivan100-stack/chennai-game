<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Anna</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛺</text></svg>" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; }
      .ui {
        position: fixed; pointer-events: none; color: #fff;
        font: 600 18px/1.3 system-ui, sans-serif; text-shadow: 0 1px 3px #000c;
      }
      #mission { top: 16px; left: 16px; }
      #wallet { top: 16px; right: 16px; font-size: 24px; }
      #prompt {
        bottom: 18%; left: 50%; transform: translateX(-50%);
        padding: 6px 14px; border-radius: 6px; background: #000a; display: none;
      }
      #hint { top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 22px; }
      #debug {
        bottom: 16px; left: 16px; padding: 8px 10px; border-radius: 6px; background: #000b;
        font: 12px/1.4 ui-monospace, monospace; display: none; pointer-events: auto;
      }
      #debug pre { margin: 0 0 6px; }
    </style>
  </head>
  <body>
    <div id="mission" class="ui"></div>
    <div id="wallet" class="ui"></div>
    <div id="prompt" class="ui"></div>
    <div id="hint" class="ui">Click to play</div>
    <div id="debug" class="ui">
      <pre id="debug-text"></pre>
      <label>Quality
        <select id="quality-mode">
          <option value="auto">Auto</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </label>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
