<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Anna</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛺</text></svg>" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; }
      .ui {
        position: fixed; pointer-events: none; color: #fff;
        font: 600 18px/1.3 system-ui, sans-serif; text-shadow: 0 1px 3px #000c;
      }
      #mission { top: 16px; left: 16px; }
      #wallet { top: 16px; right: 16px; font-size: 24px; text-align: right; }
      #wallet .loan { font-size: 13px; color: #ffd6d6; }
      #prompt {
        bottom: 18%; left: 50%; transform: translateX(-50%);
        padding: 6px 14px; border-radius: 6px; background: #000a; display: none;
      }
      #health { top: 92px; right: 16px; width: 150px; height: 9px; border-radius: 5px; background: #0007; overflow: hidden; border: 1px solid #fff8; }
      #health-fill { height: 100%; width: 100%; background: #3bc45a; transition: width 0.2s; }
      #energy { top: 106px; right: 16px; width: 150px; height: 9px; border-radius: 5px; background: #0007; overflow: hidden; border: 1px solid #fff8; }
      #energy-fill { height: 100%; width: 100%; background: #ff9f1a; transition: width 0.3s; }
      #energy-label { top: 103px; right: 172px; font: 700 12px system-ui, sans-serif; color: #fff; text-shadow: 0 1px 2px #000; }
      #energy.low { animation: starflash 0.5s infinite alternate; }
      #menu { top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; min-width: 320px; padding: 16px 20px; border-radius: 14px;
        background: #fffaf0; color: #222; font: 15px/1.5 system-ui, sans-serif; box-shadow: 0 10px 30px #000a; z-index: 6; }
      #menu h3 { margin: 0 0 2px; font-size: 18px; color: #7a2b10; }
      #menu .greet { margin: 0 0 10px; color: #555; font-style: italic; }
      #menu .row { display: flex; justify-content: space-between; gap: 16px; padding: 3px 0; }
      #menu .row.poor { color: #aaa; }
      #menu .keys { margin-top: 10px; color: #777; font-size: 13px; }
      #stars { top: 122px; right: 16px; font-size: 26px; color: #ffd21f; letter-spacing: 2px; }
      #stars.flash { animation: starflash 0.6s infinite alternate; }
      @keyframes starflash { from { opacity: 1; } to { opacity: 0.45; } }
      #banner { inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: #000a; z-index: 8; }
      #banner b { font: 800 54px system-ui, sans-serif; color: #ff5252; letter-spacing: 2px; }
      #banner span { font: 500 20px system-ui, sans-serif; color: #fff; max-width: 80vw; text-align: center; }
      #hurt { inset: 0; background: radial-gradient(ellipse at center, transparent 40%, #c00 100%); opacity: 0; transition: opacity 0.25s; }
      #speed { bottom: 16px; right: 16px; font-size: 28px; display: none; }
      #dialogue {
        bottom: 7%; left: 50%; transform: translateX(-50%); width: min(560px, 90vw); box-sizing: border-box;
        padding: 10px 16px; border-radius: 6px; border-left: 4px solid #f2c200; background: #000c;
        font-weight: 400; display: none;
      }
      #dialogue b { color: #f2c200; }
      #hint { top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 22px; }
      #minimap {
        position: fixed; bottom: 16px; left: 16px; width: 200px; height: 200px; pointer-events: none;
        border: 3px solid #ffffffdd; border-radius: 50%; box-shadow: 0 2px 10px #0009;
      }
      #phone {
        position: fixed; right: 24px; top: 50%; width: 300px; height: 560px; z-index: 5;
        transform: translate(130%, -50%); transition: transform 0.25s ease-out;
        background: #111; border-radius: 34px; padding: 14px 12px 50px; box-sizing: border-box;
        box-shadow: 0 10px 30px #000a; font: 14px/1.35 system-ui, sans-serif; color: #222;
      }
      #phone.open { transform: translate(0, -50%); }
      .phone-status { display: flex; justify-content: space-between; color: #fff; font-size: 12px; padding: 2px 10px 6px; }
      .phone-screen { background: #f4f1ea; border-radius: 20px; height: 100%; overflow-y: auto; padding: 12px; box-sizing: border-box; }
      .phone-home { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); width: 46px; height: 26px; border-radius: 13px; border: 2px solid #555; background: #222; cursor: pointer; }
      .phone-title { font: 700 20px system-ui, sans-serif; margin: 2px 0 8px; }
      .phone-sub, .muted { color: #666; font-size: 12px; }
      .phone-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
      .phone-app { position: relative; background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; cursor: pointer; }
      .phone-icon { width: 56px; height: 56px; border-radius: 16px; background: #f2c200; display: grid; place-items: center; font-size: 28px; box-shadow: 0 2px 4px #0003; }
      .phone-badge { position: absolute; top: -4px; right: 6px; background: #d32f2f; color: #fff; border-radius: 10px; padding: 0 6px; font-size: 11px; font-weight: 700; }
      .phone-card { background: #fff; border-radius: 12px; padding: 10px; margin-bottom: 10px; box-shadow: 0 1px 3px #0002; display: flex; flex-direction: column; gap: 3px; }
      .phone-card.current { background: #fff6cc; }
      .phone-row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
      .phone-btn { margin-top: 6px; border: 0; border-radius: 8px; padding: 7px 10px; background: #1b7f3a; color: #fff; font-weight: 700; cursor: pointer; }
      .phone-btn[disabled] { background: #aaa; cursor: default; }
      .phone-map { width: 100%; border-radius: 12px; cursor: zoom-in; display: block; margin-bottom: 6px; }
      .fare { color: #1b7f3a; } .due { color: #c62828; font-weight: 700; }
      .big { font: 700 30px system-ui, sans-serif; }
      .bar { height: 8px; background: #e2ddd2; border-radius: 4px; overflow: hidden; }
      .bar div { height: 100%; background: #f2c200; }
      #nav { top: 54px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 12px; padding: 8px 16px 8px 10px;
        border-radius: 14px; background: #0b6e4fee; box-shadow: 0 4px 14px #0006; max-width: min(520px, 60vw); text-shadow: none; }
      #nav .nav-arrow { font: 800 30px system-ui, sans-serif; width: 40px; text-align: center; }
      #nav .nav-text b { font-size: 17px; display: block; }
      #nav .nav-text div { font: 400 12px system-ui, sans-serif; opacity: 0.9; }
      .pm-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
      .pm-chip { flex: none; border: 1px solid #d8d2c4; background: #fff; border-radius: 16px; padding: 5px 10px; font: 600 12px system-ui, sans-serif; cursor: pointer; }
      .pm-chip.on { background: #1a73e8; color: #fff; border-color: #1a73e8; }
      .pm-box { position: relative; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 4px #0003; }
      .pm-box .phone-map { margin: 0; cursor: default; }
      .pm-btns { position: absolute; right: 6px; top: 6px; display: flex; flex-direction: column; gap: 5px; }
      .pm-btn { width: 30px; height: 30px; border: 0; border-radius: 8px; background: #fffffff0; box-shadow: 0 1px 4px #0004; font: 700 16px system-ui; cursor: pointer; }
      .pm-nav { display: none; align-items: center; gap: 10px; margin-top: 8px; padding: 8px 10px; border-radius: 12px; background: #0b6e4f; color: #fff; }
      .pm-nav .muted { color: #d6f5e9; }
      .pm-arrow { font: 800 26px system-ui; width: 30px; text-align: center; }
      .pm-navtext { flex: 1; min-width: 0; }
      .pm-dist { font: 800 16px system-ui; }
      .pm-line { font-size: 12px; font-weight: 600; }
      .pm-end { border: 0; border-radius: 8px; padding: 6px 10px; background: #fff; color: #c62828; font-weight: 700; cursor: pointer; }
      .pm-list { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
      .pm-item { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 10px; padding: 6px 8px; box-shadow: 0 1px 2px #0002; }
      .pm-dot { flex: none; width: 24px; height: 24px; border-radius: 50%; color: #fff; display: grid; place-items: center; font: 700 12px system-ui; }
      .pm-name { flex: 1; min-width: 0; font-size: 12px; }
      .pm-name b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .pm-go { margin: 0; padding: 5px 12px; background: #1a73e8; }
      #phone-toast {
        position: fixed; top: 118px; left: 50%; transform: translate(-50%, -20px); opacity: 0; z-index: 6;
        background: #111d; color: #fff; padding: 8px 14px; border-radius: 10px; font: 14px system-ui, sans-serif;
        max-width: min(560px, 90vw); transition: opacity 0.2s, transform 0.2s; pointer-events: none;
      }
      #phone-toast.show { opacity: 1; transform: translate(-50%, 0); }
      #debug {
        top: 52px; left: 16px; padding: 8px 10px; border-radius: 6px; background: #000b;
        font: 12px/1.4 ui-monospace, monospace; display: none; pointer-events: auto;
      }
      #debug pre { margin: 0 0 6px; }
      #loading {
        position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: #14161c; color: #f2c200; font: 600 18px system-ui, sans-serif;
      }
      #loading h1 { margin: 0; font-size: 40px; letter-spacing: 1px; }
      #loading .bar { width: min(320px, 70vw); height: 8px; border-radius: 4px; background: #ffffff22; overflow: hidden; }
      #loading-fill { width: 0; height: 100%; background: #f2c200; transition: width 0.2s; }
      #loading-text { color: #ccc; font-weight: 400; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="loading">
      <h1>Auto Anna</h1>
      <div class="bar"><div id="loading-fill"></div></div>
      <div id="loading-text">Loading Mylapore…</div>
    </div>
    <div id="mission" class="ui"></div>
    <div id="nav" class="ui"></div>
    <div id="wallet" class="ui"></div>
    <div id="prompt" class="ui"></div>
    <div id="dialogue" class="ui"></div>
    <div id="speed" class="ui"></div>
    <div id="health" class="ui"><div id="health-fill"></div></div>
    <div id="energy" class="ui"><div id="energy-fill"></div></div>
    <div id="energy-label" class="ui">⚡</div>
    <div id="menu" class="ui"></div>
    <div id="stars" class="ui"></div>
    <div id="hurt" class="ui"></div>
    <div id="banner" class="ui"></div>
    <canvas id="minimap"></canvas>
    <div id="hint" class="ui">Click to play</div>
    <div id="debug" class="ui">
      <pre id="debug-text"></pre>
      <label>Quality
        <select id="quality-mode">
          <option value="auto">Auto</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </label>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
